name: Executar Bot de Reserva Diariamente

on:
  workflow_dispatch: # Disparo seguro controlado via cron-job.org / Webhook ou Manual

jobs:
  executar-reserva:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Bot de Reserva (Modo Looping Inteligente com Refresh)
        run: |
          python main.py --loop --headless

      - name: Salvar Logs e Screenshots como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-e-screenshots
          path: |
            logs/
            screenshots/
          retention-days: 7
